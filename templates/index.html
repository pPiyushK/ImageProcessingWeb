<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Processing Tool</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            padding: 50px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            margin-bottom: 30px;
        }

        input {
            margin: 20px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        img {
            max-width: 500px;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🖼️ Image Processing Tool</h1>

        <form action="/" method="POST" enctype="multipart/form-data">

            <input type="file" name="image" accept="image/*" required>

            <br>

            <button type="submit">
                Upload Image
            </button>

        </form>

        {% if filename %}

            <h2>Uploaded Image</h2>

            <img src="{{ url_for('static', filename='uploads/' + filename) }}"
                 alt="Uploaded Image">

        {% endif %}

    </div>

</body>

</html>
