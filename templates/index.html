<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Processing Tool</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding: 40px;
        }

        .container {
            background: white;
            max-width: 800px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            margin: 20px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .images {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .images img {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🖼️ Image Processing Tool</h1>

    <form action="/" method="POST" enctype="multipart/form-data">

        <input type="file" name="image" accept="image/*" required>

        <br>

        <button type="submit">
            Upload & Convert to Grayscale
        </button>

    </form>

    {% if original and processed %}

    <div class="images">

        <div>
            <h3>Original</h3>

            <img src="{{ url_for('static',
                 filename='uploads/' + original) }}">
        </div>

        <div>
            <h3>Grayscale</h3>

            <img src="{{ url_for('static',
                 filename='uploads/' + processed) }}">
        </div>

    </div>

    {% endif %}

</div>

</body>

</html>
